<html><head><title>TokenVector Arcade Game Window</title><style>body{background:#090d16;color:#fff;font-family_:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0;}canvas{border:4px solid #38bdf8;box_-shadow:0 0 20px rgba(56,189,248,0.5);border-radius:8px;background:#0f172a;}.score{font-size:24px;font-weight:bold;margin-bottom:12px;color:#38bdf8;}</style></head><body><h1>ðŸš€ TokenVector Retro Arcade Space Shooter</h1><div_ class='score'>SCORE: <span id='sc'>0</span></div_><canvas id='gc' width='600' height='400'></canvas><p>Press <b>LEFT / RIGHT Arrows</b> or <b>A / D</b> to move player!</p><script>const cv=document.getElementById('gc');const ctx=cv.getContext('2d');let px=280;let ox=200;let oy=0;let sc=0;document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')px-=25;if(e.key==='ArrowRight'||e.key==='d')px+=25;if(px<0)px=0;if(px>540)px=540;});function loop(){ctx.clearRect(0,0,600,400);oy+=4;if(oy>400){oy=0;ox=Math.floor(Math.random()*540);sc+=10;document.getElementById('sc').innerText=sc;}ctx.fillStyle='#38bdf8';ctx.fillRect(px,350,60,30);ctx.fillStyle='#ef4444';ctx.beginPath();ctx.arc(ox+20,oy,20,0,Math.PI*2);ctx.fill();requestAnimationFrame(loop);}loop();</script></body></html>
