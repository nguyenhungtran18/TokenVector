name: TokenVector Cross-Platform CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ─── Windows: Build tkvc từ source, test compile .tkv ────────────────────────
  build-windows:
    name: Build & Test — Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install pyinstaller

      - name: Verify .NET Framework (ilasm.exe)
        run: |
          $ilasm = Get-ChildItem "C:\Windows\Microsoft.NET\Framework64" -Recurse -Filter "ilasm.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($ilasm) {
            Write-Host "[OK] ilasm.exe: $($ilasm.FullName)"
          } else {
            Write-Host "[FAIL] ilasm.exe not found on runner"
            exit 1
          }

      - name: Build tkvc.exe from source (PyInstaller)
        run: |
          python -m PyInstaller --onefile --name tkvc --distpath dist tkv_compile.py
          if (Test-Path "dist\tkvc.exe") {
            Write-Host "[OK] dist\tkvc.exe built successfully"
          } else {
            Write-Host "[FAIL] dist\tkvc.exe not created"
            exit 1
          }

      - name: Smoke test — compile inline hello.tkv
        run: |
          # Tạo file test inline, không phụ thuộc file committed
          Set-Content -Path "ci_hello.tkv" -Encoding UTF8 -Value @"
          # -*- coding: utf-8 -*-
          def main() -> "i32":
              print("TokenVector CI smoke test PASSED")
              return 1
          "@
          dist\tkvc.exe build ci_hello.tkv
          if (Test-Path "ci_hello.exe") {
            Write-Host "[OK] ci_hello.exe compiled"
          } else {
            Write-Host "[FAIL] compile failed"
            exit 1
          }

      - name: Run smoke test binary
        run: .\ci_hello.exe

      - name: Compile Phase 1 TUI — tkv_console
        run: |
          dist\tkvc.exe build TokenVector_UI_Design\phase1_tui\tkv_console.tkv
          Write-Host "[OK] tkv_console.exe"

      - name: Compile Phase 1 TUI — demo_tui
        run: |
          dist\tkvc.exe build TokenVector_UI_Design\phase1_tui\demo_tui.tkv
          Write-Host "[OK] demo_tui.exe"

      - name: Compile Phase 2 Web UI — tkv_json
        run: |
          dist\tkvc.exe build TokenVector_UI_Design\phase2_webui\tkv_json.tkv
          Write-Host "[OK] tkv_json.exe"

      - name: Compile Phase 2 Web UI — demo_webui
        run: |
          dist\tkvc.exe build TokenVector_UI_Design\phase2_webui\demo_webui.tkv
          Write-Host "[OK] demo_webui.exe"

      - name: Run Phase 2 demo
        run: .\TokenVector_UI_Design\phase2_webui\demo_webui.exe

      - name: Compile Phase 3 — platform_patch
        run: |
          dist\tkvc.exe build TokenVector_UI_Design\phase3_crossplatform\platform_patch.tkv
          Write-Host "[OK] platform_patch.exe"

      - name: Run Phase 3 platform patch
        run: .\TokenVector_UI_Design\phase3_crossplatform\platform_patch.exe

  # ─── Linux: Kiểm tra môi trường + file source .tkv (Phase 3 - WIP) ──────────
  check-linux:
    name: Environment Check — Linux (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        run: |
          sudo apt-get update -q
          sudo apt-get install -y dotnet-sdk-8.0

      - name: Verify dotnet version
        run: |
          dotnet --version
          echo "[OK] dotnet installed"

      - name: Find ilasm in .NET 8 SDK
        run: |
          SDK_VER=$(dotnet --version)
          echo "dotnet version: $SDK_VER"
          ILASM=$(find /usr/share/dotnet/sdk -name "ilasm" 2>/dev/null | head -1)
          if [ -n "$ILASM" ]; then
            echo "[OK] ilasm found: $ILASM"
          else
            echo "[INFO] ilasm not in /usr/share, searching ~/.dotnet..."
            ILASM=$(find ~/.dotnet/sdk -name "ilasm" 2>/dev/null | head -1 || true)
            if [ -n "$ILASM" ]; then
              echo "[OK] ilasm found: $ILASM"
            else
              echo "[WARN] ilasm not found — Phase 3 cross-compile not ready yet"
            fi
          fi

      - name: Verify Phase 3 .tkv source files exist
        run: |
          files=(
            "TokenVector_UI_Design/phase3_crossplatform/platform_patch.tkv"
            "TokenVector_UI_Design/phase3_crossplatform/build_multiplatform.tkv"
            "TokenVector_UI_Design/phase3_crossplatform/install_dotnet_wsl.sh"
            ".github/workflows/cross_platform_ci.yml"
          )
          all_ok=1
          for f in "${files[@]}"; do
            if [ -f "$f" ]; then
              echo "[OK] $f"
            else
              echo "[FAIL] missing: $f"
              all_ok=0
            fi
          done
          if [ $all_ok -eq 0 ]; then exit 1; fi

      - name: Verify Phase 1 & 2 .tkv source files exist
        run: |
          files=(
            "TokenVector_UI_Design/phase1_tui/tkv_console.tkv"
            "TokenVector_UI_Design/phase1_tui/tkv_menu.tkv"
            "TokenVector_UI_Design/phase1_tui/tkv_progress.tkv"
            "TokenVector_UI_Design/phase1_tui/tkv_table.tkv"
            "TokenVector_UI_Design/phase1_tui/demo_tui.tkv"
            "TokenVector_UI_Design/phase2_webui/tkv_json.tkv"
            "TokenVector_UI_Design/phase2_webui/tkv_http.tkv"
            "TokenVector_UI_Design/phase2_webui/demo_webui.tkv"
          )
          all_ok=1
          for f in "${files[@]}"; do
            if [ -f "$f" ]; then
              echo "[OK] $f"
            else
              echo "[FAIL] missing: $f"
              all_ok=0
            fi
          done
          if [ $all_ok -eq 0 ]; then exit 1; fi

      - name: Summary
        run: |
          echo "=========================================="
          echo " Linux CI Check Complete"
          echo " Phase 1 TUI   : source files verified"
          echo " Phase 2 WebUI : source files verified"
          echo " Phase 3 CP    : .NET 8 SDK installed"
          echo " Status: Cross-compile PENDING (Phase 3 WIP)"
          echo "=========================================="

  # ─── macOS: Kiểm tra môi trường + file source .tkv (Phase 3 - WIP) ──────────
  check-macos:
    name: Environment Check — macOS ARM
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        run: |
          brew install dotnet@8 || true
          echo 'export PATH="/usr/local/opt/dotnet@8/bin:$PATH"' >> $GITHUB_ENV

      - name: Verify dotnet version
        run: |
          dotnet --version || echo "[WARN] dotnet not in PATH, trying alternative..."
          which dotnet || find /usr/local -name dotnet 2>/dev/null | head -3

      - name: Find ilasm in .NET 8 SDK
        run: |
          ILASM=$(find /usr/local/share/dotnet -name "ilasm" 2>/dev/null | head -1 || true)
          if [ -n "$ILASM" ]; then
            echo "[OK] ilasm found: $ILASM"
          else
            echo "[WARN] ilasm not found — Phase 3 macOS cross-compile not ready yet"
          fi

      - name: Verify Phase 3 .tkv source files exist
        run: |
          files=(
            "TokenVector_UI_Design/phase3_crossplatform/platform_patch.tkv"
            "TokenVector_UI_Design/phase3_crossplatform/build_multiplatform.tkv"
          )
          for f in "${files[@]}"; do
            if [ -f "$f" ]; then
              echo "[OK] $f"
            else
              echo "[FAIL] missing: $f"
              exit 1
            fi
          done

      - name: Summary
        run: |
          echo "=========================================="
          echo " macOS CI Check Complete"
          echo " Phase 1 & 2   : source files verified"
          echo " Phase 3 CP    : .NET 8 SDK attempted"
          echo " Status: Cross-compile PENDING (Phase 3 WIP)"
          echo "=========================================="
